<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | EduAdmission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<nav class="navbar site-nav navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">E</span> EduAdmission</a><a href="index.html" class="text-white text-decoration-none small">← Back to home</a></div></nav>
<main class="container auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><span class="eyebrow">STUDENT PORTAL</span><h1 class="h2 fw-bold mt-2">Welcome back</h1><p class="text-secondary">Sign in to continue to your account.</p></div>
    <div id="formMessage" class="alert d-none" role="alert"></div>
    <form id="loginForm">
      <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control form-control-lg" type="email" id="email" name="email" required placeholder="you@example.com"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" type="password" id="password" name="password" required placeholder="Enter your password"></div>
      <button class="btn btn-primary btn-lg rounded-pill w-100 mt-2" id="loginButton" type="submit">Sign in</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">New student? <a href="register.html" class="fw-semibold">Create an account</a></p>
  </div>
</main>
<script src="js/config.js"></script><script src="js/auth.js"></script>
</body>
</html>
