<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Account | EduAdmission</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<nav class="navbar site-nav navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">E</span> EduAdmission</a><a href="index.html" class="text-white text-decoration-none small">← Back to home</a></div></nav>
<main class="container auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><span class="eyebrow">JOIN OUR COMMUNITY</span><h1 class="h2 fw-bold mt-2">Create your account</h1><p class="text-secondary">Register to begin your admission journey.</p></div>
    <div id="formMessage" class="alert d-none" role="alert"></div>
    <form id="registerForm">
      <div class="mb-3"><label class="form-label" for="fullName">Full name *</label><input class="form-control form-control-lg" id="fullName" name="fullName" required maxlength="100" placeholder="Enter your full name"></div>
      <div class="mb-3"><label class="form-label" for="email">Email address *</label><input class="form-control form-control-lg" type="email" id="email" name="email" required placeholder="you@example.com"></div>
      <div class="mb-3"><label class="form-label" for="phone">Phone number</label><input class="form-control form-control-lg" id="phone" name="phone" placeholder="03XXXXXXXXX"></div>
      <div class="mb-3"><label class="form-label" for="password">Password *</label><input class="form-control form-control-lg" type="password" id="password" name="password" minlength="8" required placeholder="At least 8 characters"><div class="form-text">Use at least 8 characters.</div></div>
      <button class="btn btn-primary btn-lg rounded-pill w-100 mt-2" id="registerButton" type="submit">Create account</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="login.html" class="fw-semibold">Sign in</a></p>
  </div>
</main>
<script src="js/config.js"></script><script src="js/auth.js"></script>
</body>
</html>
